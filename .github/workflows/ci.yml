# prp-framework CI — a real CI ground for gobikom/prp-framework (นุด, 2026-10-09, zero-touch: a repo
# with CI lets merger approve on evidence instead of an operator turn). Runs the repo's own
# test suite on the goko self-hosted runner, the same way gobikom/ops does. The tests get no
# secrets; only the red-run alert step reads the Telegram credentials, by name, from the host.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR runs share one group per PR, so a new push cancels that PR's older run; each push to
# main keeps its own group (its SHA), so every main SHA keeps its own CI result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: bats tests
    runs-on: [self-hosted, goko]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash  # bash --noprofile --norc -eo pipefail
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # bats (bats-core) is the runner host's, on its PATH via ~/.npm-global/bin. Every *.bats
      # suite under tests/ runs. Green requires bats to exit 0 AND its JUnit report to count
      # 0 failures, 0 errors and 0 skipped, with at least one test (the suites have no skips,
      # so a skip appearing here is a change to look at, not noise), and to list every @test
      # each *.bats file declares (more is fine, fewer is red); an @test in a file bats does
      # not run is red too. Each test counts once, keyed by suite + name. The counts come from
      # the report bats writes, never from parsing its console text.
      - name: Run the bats suites
        timeout-minutes: 15
        run: |
          command -v bats >/dev/null || { echo "::error::bats not found on the runner PATH"; exit 1; }
          out="$RUNNER_TEMP/bats-report"
          rm -rf "$out"; mkdir -p "$out"
          rc=0
          bats -r tests --report-formatter junit -o "$out" || rc=$?
          verdict=0
          counts=$(python3 -I - "$out/report.xml" tests <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except Exception as e:
              print(f"JUnit report unreadable ({type(e).__name__})")
              sys.exit(1)
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          n = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors")}
          # One outcome per test (suite + name), whatever number of <testcase> elements exist.
          outcome = {}
          for s in suites:
              for tc in s.iter("testcase"):
                  marks = outcome.setdefault((s.get("name"), tc.get("classname"), tc.get("name")), set())
                  for c in tc:
                      if c.tag in ("failure", "error"):
                          marks.add("bad")
                      elif c.tag == "skipped":
                          marks.add("skip")
          kinds = ["bad" if "bad" in m else "skip" if "skip" in m else "pass" for m in outcome.values()]
          n["skipped"], passed = kinds.count("skip"), kinds.count("pass")
          print(" ".join(f"{k}={v}" for k, v in n.items()) + f" passed={passed}")
          # Every @test a suite declares must be in the report: a .bats file that exits at top
          # level, or a test file bats never picks up (not *.bats), would otherwise vanish.
          # A declaration is a column-0 `@test <name> {` line (one-line bodies included). The
          # report may hold MORE tests (bats_test_function, loops), never fewer. Docs (*.md)
          # under tests/ are not scanned
          # for stray declarations. A column-0 `@test ... {` line inside a heredoc would count as
          # a declaration and turn the run red; none exists today.
          decl = re.compile(r"@test\s.*\{")
          declared, problems = {}, []
          for f in sorted(pathlib.Path(sys.argv[2]).rglob("*")):
              if not f.is_file() or f.suffix == ".md":
                  continue
              k = sum(1 for line in f.read_text(errors="replace").splitlines() if decl.match(line))
              rel = f.relative_to(sys.argv[2]).as_posix()
              if f.suffix == ".bats":
                  declared[rel] = k
              elif k:
                  problems.append(f"{rel}: {k} @test outside a .bats file")
          reported = {}
          for s in suites:
              reported[s.get("name")] = sum(1 for _ in s.iter("testcase"))
          for rel, k in declared.items():
              if reported.get(rel, 0) < k:
                  problems.append(f"{rel}: {k} declared, {reported.get(rel, 0)} reported")
          for p in problems:
              print(f"::error::{p}", file=sys.stderr)
          ok = (passed > 0 and n["skipped"] == 0 and n["failures"] == n["errors"] == 0
                and "bad" not in kinds and not problems)
          sys.exit(0 if ok else 1)
          PY
          ) || verdict=$?
          if [ "$rc" -ne 0 ] || [ "$verdict" -ne 0 ]; then
            echo "::error::bats did not pass (exit=$rc, report: ${counts:-none})"
            exit 1
          fi
          echo "bats passed (report: $counts)"

      # A red run on main or a manual dispatch reaches the operator on Telegram; a PR's red run
      # shows on the PR itself. Same channel and credential names as gobikom/ops CI.
      # Known gap: a run that never gets a runner, or loses it mid-job, never reaches this step,
      # so it alerts nobody; monitoring runner liveness outside CI is tracked in
      # gobikom/agent-devops#1230.
      - name: Alert on a red main/dispatch run
        if: (failure() || cancelled()) && github.event_name != 'pull_request'
        timeout-minutes: 1
        run: |
          set -uo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          msg="⚠️ [ci] gobikom/prp-framework CI did not pass on ${GITHUB_EVENT_NAME} @ ${GITHUB_SHA:0:8} (${{ job.status }}). $run_url"
          logger -t prp-framework-ci "CI_RED event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA run=$GITHUB_RUN_ID" || true
          token="$(grep -h '^TK_PSAK_BOT_TOKEN=' "$HOME/.secrets/telegram-bots.env" "$HOME/.secrets/shared.env" 2>/dev/null | head -1 | cut -d= -f2-)" || true
          chat="$(grep -h '^TELEGRAM_CHAT_ID=' "$HOME/.secrets/shared.env" 2>/dev/null | head -1 | cut -d= -f2-)" || true
          if [[ -z "$token" || -z "$chat" ]]; then
            echo "::error::prp-framework CI alert: Telegram credentials not found by name — nobody was told about $run_url"
            exit 1
          fi
          err="$(mktemp)"
          code="$(printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$token" \
            | curl -g -sS -o /dev/null -w '%{http_code}' --max-time 10 -K - \
                --data-urlencode "chat_id=$chat" --data-urlencode "text=$msg" 2>"$err")" || true
          unset token
          if [[ "$code" != "200" ]]; then
            echo "::error::prp-framework CI alert: Telegram send failed (http=${code:-none}: $(head -c 300 "$err" | sed -E 's#/bot[^/[:space:]]*#/bot<redacted>#g' | tr '\n' ' ')) — nobody was told about $run_url"
            rm -f "$err"; exit 1
          fi
          rm -f "$err"
          echo "prp-framework CI alert: Telegram sent"
